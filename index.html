<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding:56px 32px
        }
        .cube{
            width: 170px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            letter-spacing: 1px;
        }
        .cube::after{
            content: "";
        }
        .cube:hover::after{
            content: "hover";
        }
        .c1{
            border-radius: 0;
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            box-shadow: 0 10px 24px rgba(255, 94, 98, .35);
        }
        .c1:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(255, 94, 98, .35);
        }
        .c2{
            border-radius: 20px;
            background: linear-gradient(45deg,#3cca6e,#33d8bc);
            box-shadow: 0 10px 24px rgba(52, 216, 189, .35);
        }
        .c2:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(52, 216, 189, .35);
        }
        .c3{
            border-radius: 40px;
            background: linear-gradient(#ab87a5,#716494);
            box-shadow: 0 10px 24px rgba(113, 100, 148, .35);
        }
        .c3:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(113, 100, 148, .35);
        }
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg,#f4df5d,#fca383);
            box-shadow: 0 10px 24px rgba(252, 163, 131, .35);
        }
        .c4:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(252, 163, 131, .35);
        }
        .c5{
            border-radius: 10px;
            background: linear-gradient(120deg,#487e63,#4d6d81);
            box-shadow: 0 10px 24px rgba(72, 126, 99, .35);
        }
        .c5:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(72, 126, 99, .35);
        }
        .c6{
            border-radius: 50%;
            background: linear-gradient(45deg,#8372a6,#d2a1bd);
            box-shadow: 0 10px 24px rgba(131, 114, 166, .35);
        }
        .c6:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(131, 114, 166, .35);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
